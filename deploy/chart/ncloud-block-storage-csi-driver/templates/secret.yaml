{{- if .Values.credentials.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.credentials.secretName | quote }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  accessKey: {{ required "credentials.accessKey is required when credentials.create=true" .Values.credentials.accessKey | quote }}
  secretKey: {{ required "credentials.secretKey is required when credentials.create=true" .Values.credentials.secretKey | quote }}
{{- end }}
{{- if .Values.credentials.node.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ required "credentials.node.secretName is required when credentials.node.create=true" .Values.credentials.node.secretName | quote }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  accessKey: {{ required "credentials.node.accessKey is required when credentials.node.create=true" .Values.credentials.node.accessKey | quote }}
  secretKey: {{ required "credentials.node.secretKey is required when credentials.node.create=true" .Values.credentials.node.secretKey | quote }}
{{- end }}
